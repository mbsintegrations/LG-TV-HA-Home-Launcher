blueprint:
  name: LG Home Launcher on TV startup
  description: >-
    Select the configured launcher source once after an observed off-to-on
    transition. Does not power on the TV or retry. Install the launcher first.
  domain: automation
  input:
    tv:
      name: LG television
      selector:
        entity:
          filter:
            - domain: media_player
              integration: webostv
    launcher_source:
      name: Launcher source name
      description: Exact source_list name on this TV.
      default: Home
      selector:
        text: {}
    settle_seconds:
      name: On-state settling time
      default: 3
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: seconds
    minimum_off_seconds:
      name: Minimum time reported off
      description: Ignore brief false-off reports during playback. Quick standby cycles shorter than this need a Home press. Longer connection outages can still resemble power-off.
      default: 60
      selector:
        number:
          min: 30
          max: 600
          unit_of_measurement: seconds
    excluded_app:
      name: Do not interrupt this app ID
      description: For example a camera overlay. Leave empty if unused.
      default: com.mbs.cameraoverlay
      selector:
        text: {}
variables:
  minimum_off: !input minimum_off_seconds
  tv_entity: !input tv
  source_name: !input launcher_source
  excluded_id: !input excluded_app
triggers:
  - trigger: state
    entity_id: !input tv
    from: 'off'
    to: 'on'
    for:
      seconds: !input settle_seconds
conditions:
  - condition: template
    value_template: >-
      {{ trigger is defined and trigger.from_state is defined
         and trigger.from_state is not none and trigger.to_state is defined
         and trigger.to_state is not none
         and trigger.from_state.state == 'off' and trigger.to_state.state == 'on'
         and (as_timestamp(trigger.to_state.last_changed, 0)
              - as_timestamp(trigger.from_state.last_changed, 0)) >= minimum_off | int(60) }}
  - condition: template
    value_template: >-
      {{ is_state(tv_entity, 'on')
         and state_attr(tv_entity, 'source') != source_name
         and source_name in (state_attr(tv_entity, 'source_list') or [])
         and (not excluded_id or state_attr(tv_entity, 'app_id') != excluded_id) }}
actions:
  - action: media_player.select_source
    target:
      entity_id: !input tv
    data:
      source: !input launcher_source
mode: single
max_exceeded: silent
