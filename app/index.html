<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1920, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file:; img-src 'self' file: data:; connect-src 'self' file: __HA_ORIGIN__; object-src 'none'; base-uri 'none'">
<title>Home Launcher</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="community.css"><link rel="stylesheet" href="theme.css"></head>
<body><main id="screen">
 <div class="landscape" aria-hidden="true"><div class="sun"></div><div class="ridge far"></div><div class="ridge near"></div></div>
 <header><div class="identity"><span>HOME</span><span class="room" id="room"></span></div><div class="header-right"><span id="connection" class="connection">Starting</span><span id="date"></span></div></header>
 <section class="hero"><div class="welcome"><div id="clock">—:—</div></div><div class="weather" id="weather"><div id="location" class="weather-place"></div><div class="weather-main"><span id="weather-temp">—</span><div class="weather-copy"><div id="weather-condition">Weather</div><div id="weather-detail">From Home Assistant</div></div></div></div></section>
 <section class="watch"><div class="section-label"><h1>Your apps</h1><span id="preview-note"></span></div><div id="apps" class="apps"></div></section>
 <section class="controls-section" id="controls-section"><div class="section-label"><h2>Home controls</h2><span>SELECT TO CONTROL</span></div><div id="controls" class="controls"></div></section>
 <section class="home-cards" id="cards">
  <button id="temperatures" class="home-card temperatures focusable"><div class="card-top"><span id="temperatures-title">Room temperatures</span><span class="text-action">All rooms</span></div><div id="room-summary" class="room-summary"></div><div class="card-bottom">Comfort around the house</div></button>
  <div id="laundry" class="home-card laundry"><div class="card-top"><span id="status-title">Appliances & status</span></div><div id="laundry-status"></div></div>
  <div id="energy" class="home-card energy"><div class="card-top"><span id="energy-title">Energy flow</span><span class="energy-note">kW</span></div><div class="energy-diagram"><div class="energy-bus" aria-hidden="true"><span></span><span></span><span></span></div><div id="energy-top" class="energy-row top"></div><div id="energy-bottom" class="energy-row bottom"></div></div></div>
 </section>
 <footer><div><span class="key">OK</span> Select <span class="key">BACK</span> Return</div><div id="updated"></div></footer><div class="credits">by mbsintegrations.ie</div>
</main>
<div id="shade" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-heading"><h2 id="dialog-title"></h2><button id="close-dialog">Close</button></div><div id="dialog-content"></div><div id="dialog-actions"></div></section></div>
<div id="toast" role="status" hidden></div><script src="profile.js"></script><script src="ha.js"></script><script src="helper.js"></script><script src="weather.js"></script><script src="app.js"></script></body></html>
